[project]
name = "maid-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "maid-voice",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
maid-agent = "maid_agent:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
maid-voice = { path = "../maid_voice", editable = true }
