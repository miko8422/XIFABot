# Maid Voice Cascade v0.1 configuration. Secrets come from the repo-root .env, never from this file.

[audio]
input_device = ""          # "" = system default; name substring otherwise
output_device = ""
capture_sample_rate = 16000
playback_sample_rate = 24000
save_raw_audio = false     # opt-in debug capture only

[asr]
provider = "omlx"
base_url = "http://127.0.0.1:9800"
model = "mlx-community--Qwen3-ASR-0.6B-8bit"
language = "ja"            # pinned: auto-detect ("") misread Japanese as Korean in live use (2026-10-31)

[llm]
provider = "deepseek"      # openai-compatible chat completions
base_url_env = "BASE_URL"
api_key_env = "API_KEY"
model = "deepseek-flash"   # DeepSeek V4.1 Flash
max_tokens = 220          # room for a spoken line plus delegate arguments (the probe saw goals of ~90 tokens)
# thinking must be off: with it on, 2/5 probe turns spent the whole budget reasoning
extra_body = { thinking = { type = "disabled" }, reasoning_effort = "low" }
history_turns = 4
output_language = "ja"

[agent]
# maid-agent serve only (ARCHITECTURE §4, P1)
routing = "tool"           # tool: delegate tool inside the reply call | keyword: maid_agent/router.py decides
db = "runs/harness/tasks.sqlite3"
runner = "codex"           # codex: real sub-agents for quick/work tasks | fake: the P1 stand-in
codex = "codex"            # Codex CLI
codex_home = "runs/codex_home"  # the sub-agents' own clean CODEX_HOME: rebuilt from your ~/.codex before every
                           # run (provider + login only, so cc-switch changes apply; no skills, MCP, hooks)
model = "gpt-5.6-luna"     # sub-agent model, through your own Codex provider/account
max_running = 2            # sub-agents at once; more wait in line. They survive a restart of serve
daily_token_budget = 0     # 0 = no limit; else she refuses new sub-agents once today's tokens reach it
retention_days = 7         # a finished task's files are deleted after this many days; its logs are kept
tasks_dir = "runs/tasks"   # one workspace per task: its files and its full event stream
quick_effort = "low"       # quick: live web search; reads/writes only its own folder
quick_timeout_s = 300
work_effort = "low"        # work: same sandbox; anything outside its folder needs your yes by voice
work_timeout_s = 1800
fake_quick_s = 20          # the fake sub-agent's run time per tier (runner = "fake", and computer tasks until P6)
fake_work_s = 45
fake_computer_s = 15
quiet_gap_s = 1.5          # task news waits this long after anyone spoke
heartbeat_s = 180          # unprompted progress for a long task at most this often
memory_db = "runs/maid/memory.sqlite3"  # her own file: conversation log (P2), memory bank later
restore_turns = 8          # messages put back into her history on startup (capped by [llm].history_turns)
activity_source = "auto"   # auto: ActivityWatch (127.0.0.1:5600) if running, else macOS front app + idle | macos | off

[agent.activity]
# which apps count as what (app name, bundle id or window-title words; ActivityWatch adds titles)
# add any app to `game` to simulate a play session on the Mac (ARCHITECTURE §5.6)
game = ["Steam", "com.valvesoftware", "Battle.net", "Epic Games", "Minecraft", "League of Legends", "Genshin", "原神"]
call = ["zoom.us", "Microsoft Teams", "FaceTime", "Webex", "Google Meet", "Meet -", "Slack Huddle"]
afk_after_s = 180          # no input this long: away
debounce_s = 5             # a new activity must hold this long (alt-tab is not a change)

[agent.speech]
# when she speaks unprompted, per activity (speech arbiter rule 6). task_news: speak | hold
greet_after_s = 600        # back after this long away: she greets and tells what came in meanwhile
working = { task_news = "speak", proactive = true, cooldown_s = 600 }
gaming = { task_news = "speak", proactive = true, cooldown_s = 300, style = "あきらはゲーム中。邪魔にならないよう、一文だけ短く。" }
call = { task_news = "hold", proactive = false }
away = { task_news = "hold", proactive = false }

[persona]
# role card + expressions mined from her lines (scripts/build_expressions.py); off = the built-in prompt in llm.py
enabled = true
card = "../maid_agent/persona/natsume.v2.toml"
expressions = "../maid_agent/persona/natsume_expressions.jsonl"
top_k = 4

[tts]
provider = "omlx"
base_url = "http://127.0.0.1:9800"
model = "mlx-community--Qwen3-TTS-12Hz-1.7B-Base-8bit"
stream = true
streaming_interval = 0.2
# codec sampling temperature; model default 0.9 causes occasional 80 ms "dropped mic" bursts
temperature = 0.4
voice_profile = "natsume_ft"   # fine-tuned; "natsume_a" = the previous ref_a clone

[voices.natsume_ft]  # fine-tuned on 3.9 h of her lines (sft/, epoch 1), 8-bit MLX in oMLX's model dir
speaker = "natsume"
model = "natsume-qwen3tts-sft-e1-8bit"
language = "japanese"

[voices.natsume_a]
ref_audio = "voices/natsume/ref_a.wav"
ref_text_file = "voices/natsume/ref_a.txt"
language = "japanese"

[voices.natsume_c]  # calm line nat013_034
ref_audio = "voices/natsume/ref_c.wav"
ref_text_file = "voices/natsume/ref_c.txt"
language = "japanese"

[voices.natsume_d]  # casual nat110_014+nat013_007
ref_audio = "voices/natsume/ref_d.wav"
ref_text_file = "voices/natsume/ref_d.txt"
language = "japanese"

[voices.natsume_e]  # tsun nat107_006
ref_audio = "voices/natsume/ref_e.wav"
ref_text_file = "voices/natsume/ref_e.txt"
language = "japanese"

[voices.natsume_f]  # tsun nat013_086
ref_audio = "voices/natsume/ref_f.wav"
ref_text_file = "voices/natsume/ref_f.txt"
language = "japanese"

[metrics]
dir = "runs"

[vad]
# hands-free endpointing (energy VAD with adaptive noise floor)
spec_silence_ms = 250   # start ASR+LLM+TTS speculatively; playback held until end_silence_ms
end_silence_ms = 600    # commits the turn; raise if it cuts you off mid-thought
min_speech_ms = 120
threshold_ratio = 3.0
min_threshold = 0.008
speculative = true
barge_in = false        # voice interrupts her: headphones only until echo cancellation exists
