[project]
name = "maid-voice"
version = "0.1.0"
description = "Maid Voice Cascade v0.1: streaming STT -> LLM -> cloned-voice TTS prototype"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.1",          # persona: expression retrieval (multilingual-e5-small)
    "transformers>=5.20.2",
]

[project.scripts]
maid-voice = "maid_voice.app:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
eval = [
    "matplotlib>=3.11.2",
    "pykakasi>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
asyncio_default_fixture_loop_scope = "function"
