[project]
name = "maid-harness"
version = "0.4.0"
description = "Harness env for the Maid Agent: event inbox, task registry, sub-agent supervisor, reporters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",        # subagent_mcp: the sub-agent tools over streamable HTTP
    "httpx>=0.28.1",
    "mss>=10.2.0",            # reporters/screen
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "torch>=2.14.1",          # reporters/screen: SigLIP2 change scoring
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
