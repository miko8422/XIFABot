[project]
name = "maid-agent"
version = "0.4.0"
description = "The Maid: persona, routing, notifications, on top of maid_voice and maid_harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "maid-harness",
    "maid-voice",
]

[project.scripts]
maid-agent = "maid_agent:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
maid-harness = { workspace = true }
maid-voice = { workspace = true }
